# Name the components on this agent
agent.sources = kafka-source
agent.channels = mem-channel
agent.sinks = hdfs-sink
# --- SOURCE: Kafka ---
agent.sources.kafka-source.type = org.apache.flume.source.kafka.KafkaSource
# Use the internal Docker network name and port
agent.sources.kafka-source.kafka.bootstrap.servers = kafka:29092
agent.sources.kafka-source.kafka.topics = hospital-alerts
agent.sources.kafka-source.kafka.consumer.group.id = flume-consumer-group
# Start reading from the beginning of the topic
agent.sources.kafka-source.kafka.consumer.auto.offset.reset = earliest
# --- SINK: HDFS ---
agent.sinks.hdfs-sink.type = hdfs
# Points to your namenode service in docker-compose
agent.sinks.hdfs-sink.hdfs.path = hdfs://namenode:9000/user/root/hospital_alerts_archive
agent.sinks.hdfs-sink.hdfs.filePrefix = patient-alerts
agent.sinks.hdfs-sink.hdfs.fileType = DataStream
agent.sinks.hdfs-sink.hdfs.writeFormat = Text
# Roll (create new file) every 30 seconds or 10 events
agent.sinks.hdfs-sink.hdfs.rollInterval = 30
agent.sinks.hdfs-sink.hdfs.rollSize = 0
agent.sinks.hdfs-sink.hdfs.rollCount = 10
# --- CHANNEL: Memory ---
agent.channels.mem-channel.type = memory
agent.channels.mem-channel.capacity = 1000
agent.channels.mem-channel.transactionCapacity = 100
# --- BINDING ---
agent.sources.kafka-source.channels = mem-channel
agent.sinks.hdfs-sink.channel = mem-channel