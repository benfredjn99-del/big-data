version: '3.8'

services:

  # ============================================================
  # ZOOKEEPER
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bigdata-network

  # ============================================================
  # KAFKA
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 2000000
    networks:
      - bigdata-network

  # ============================================================
  # HADOOP NAMENODE
  # ============================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=olist-cluster
    env_file:
      - ./hadoop/hadoop.env
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./data:/data
    networks:
      - bigdata-network

  # ============================================================
  # HADOOP DATANODE
  # ============================================================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop/hadoop.env
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks:
      - bigdata-network

  # ============================================================
  # MYSQL
  # ============================================================
  mysql:
    image: mysql:5.7
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: cloudera
      MYSQL_DATABASE: hospital_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data:/data
    networks:
      - bigdata-network

# ============================================================
  # SQOOP
  # ============================================================
  sqoop:
    build:
      context: ./sqoop
      dockerfile: Dockerfile
    container_name: sqoop
    depends_on:
      - mysql
      - namenode
      - datanode
    env_file:
      - ./hadoop/hadoop.env
    volumes:
      - ./data:/data
    networks:
      - bigdata-network
    command: tail -f /dev/null

# ============================================================
  # FLUME
  # ============================================================
  #Update this section in your docker-compose.yml
  flume:
    image: probablyfine/flume
    container_name: flume
    depends_on:
      - namenode
    volumes:
      - ./flume/flum.conf:/opt/flume-config/flume.conf
      - ./data:/data
    environment:
      - FLUME_AGENT_NAME=agent
      - FLUME_CONF_FILE=/opt/flume-config/flume.conf
    networks:
      - bigdata-network

# ============================================================
  # KAFKA APP (Producer + Consumer Python)
  # ============================================================
  kafka-app:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    container_name: kafka-app
    depends_on:
      - kafka
    volumes:
      - ./data:/data
      - ./kafka/temp:/app
    networks:
      - bigdata-network
    command: tail -f /dev/null
    

networks:
  bigdata-network:
    driver: bridge

volumes:
  namenode_data:
  datanode_data:
  mysql_data:

